<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content" />
    <title>CodeMirror Kakoune Playground</title>
  </head>
  <body data-theme="night">
    <main class="shell">
      <header class="bar">
        <div class="brand-container">
          <span class="brand">codemirror-kakoune</span>
          <nav class="playground-nav" aria-label="Playground versions">
            <a href="../">CM6</a>
            <a href="./" aria-current="page">CM5</a>
          </nav>
          <a href="https://github.com/Yukaii/codemirror-kakoune" class="github-link" target="_blank" rel="noopener noreferrer" aria-label="GitHub Repository">↗</a>
        </div>
        <div class="controls">
          <button id="config-toggle" class="control config-toggle" type="button">settings</button>
          <div id="config-modal" class="register-popover config-modal">
            <div class="popover-header"><span>Settings</span><button id="config-modal-close" type="button">×</button></div>
            <div class="config-body">
              <div class="config-section">
                <span class="config-section-title">Appearance</span>
                <label class="config-row" for="theme-select"><span>Theme</span><select id="theme-select"><option value="night">Night</option><option value="paper">Paper</option><option value="sepia">Sepia</option></select></label>
                <label class="config-row" for="font-size-select"><span>Font size</span><select id="font-size-select"><option value="13">Small</option><option value="14" selected>Medium</option><option value="16">Large</option></select></label>
              </div>
            </div>
          </div>
          <span class="state">mode: <strong id="mode-pill">select</strong><span class="hint">CM5 keymap</span></span>
        </div>
      </header>

      <div id="editor">
        <textarea id="editor-input">Welcome to the CodeMirror 5 Kakoune playground.

Move with h, j, k, l. Press x to select a line, d to delete, i or a to insert, and Esc to return to select mode.

This playground uses CodeMirror 5's native keyMap and command APIs.</textarea>
      </div>

      <div class="hint">Select mode: <strong>h j k l</strong> move, <strong>x</strong> selects a line, <strong>d</strong> deletes. Insert mode: <strong>i</strong> or <strong>a</strong>, then <strong>Esc</strong>.</div>
      <footer class="footer"><span>inspired by <a href="https://kakoune.org" target="_blank" rel="noopener noreferrer">kakoune</a>, built on <a href="https://codemirror.net/5/" target="_blank" rel="noopener noreferrer">CodeMirror 5</a></span></footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
