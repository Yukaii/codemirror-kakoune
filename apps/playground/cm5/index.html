<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=overlays-content" />
    <title>CodeMirror Kakoune Playground</title>
  </head>
  <body data-theme="night">
    <main class="shell">
      <header class="bar">
        <div class="brand-container">
          <span class="brand">codemirror-kakoune</span>
          <nav class="playground-nav" aria-label="Playground versions">
            <a href="../">CM6</a>
            <a href="./" aria-current="page">CM5</a>
          </nav>
          <a href="https://github.com/Yukaii/codemirror-kakoune" class="github-link" target="_blank" rel="noopener noreferrer" aria-label="GitHub Repository">↗</a>
          <a href="https://www.npmjs.com/package/codemirror-kakoune-cm5" class="package-link" target="_blank" rel="noopener noreferrer" aria-label="NPM Package">npm</a>
        </div>
        <div class="controls">
          <button id="config-toggle" class="control config-toggle" type="button">settings</button>
          <div id="config-modal" class="register-popover config-modal">
            <div class="popover-header"><span>Settings</span><button id="config-modal-close" type="button">×</button></div>
            <div class="config-body">
              <div class="config-section">
                <span class="config-section-title">Appearance</span>
                <label class="config-row" for="theme-select"><span>Theme</span><select id="theme-select"><option value="night">Night</option><option value="paper">Paper</option><option value="sepia">Sepia</option></select></label>
                <label class="config-row" for="font-family-select"><span>Font family</span><select id="font-family-select"><option value="mono">System Mono</option><option value="sans">System Sans</option><option value="serif">System Serif</option></select></label>
                <label class="config-row" for="font-size-select"><span>Font size</span><select id="font-size-select"><option value="16" selected>Small</option><option value="17">Medium</option><option value="18">Large</option></select></label>
              </div>
              <div class="config-section">
                <span class="config-section-title">Editor</span>
                <label class="config-row" for="line-numbers-select"><span>Line numbers</span><select id="line-numbers-select"><option value="on">On</option><option value="off">Off</option></select></label>
              </div>
              <div class="config-section">
                <span class="config-section-title">Which-key</span>
                <label class="config-row" for="layout-select"><span>Layout</span><select id="layout-select"><option value="vertical">Vertical</option><option value="horizontal">Horizontal</option></select></label>
              </div>
            </div>
          </div>
          <span class="state">mode: <strong id="mode-pill">normal</strong><span class="search-container">search: <code id="search-pill">…</code></span><span class="register-container">register: <code id="register-pill">…</code></span></span>
        </div>
      </header>

      <div id="editor">
        <textarea id="editor-input"># Welcome to the CodeMirror 5 Kakoune playground

Move with **h**, **j**, **k**, **l**, and extend with **H**, **J**, **K**, **L**. Word motions use **w**, **b**, **e** and **W**, **B**, **E**. Capital **G** starts document/line extension commands. Press **x** to select a line, **d** to delete, **i** or **a** to insert, and **Esc** to return to normal mode.

This playground uses the CodeMirror 5 adapter over the shared `kakoune-core` engine.</textarea>
        <div id="which-key-hud" class="hidden"><div class="hud-header"><span id="hud-title" class="hud-title">which-key</span><span id="hud-prompt" class="hud-prompt hidden"></span></div><div class="hud-items"></div></div>
      </div>

      <div class="hint">Normal mode: <strong>h j k l</strong> move, <strong>H J K L</strong> extend, <strong>s</strong> selects matches, <strong>S</strong> splits. Insert mode: <strong>i</strong> or <strong>a</strong>, then <strong>Esc</strong>.</div>
      <footer class="footer"><span>inspired by <a href="https://kakoune.org" target="_blank" rel="noopener noreferrer">kakoune</a>, built on <a href="https://codemirror.net/5/" target="_blank" rel="noopener noreferrer">CodeMirror 5</a></span></footer>
    </main>
    <nav id="vk" class="vk" aria-label="Virtual keyboard">
      <div class="vk-row"><button class="vk-key vk-key-esc" data-key="Escape" data-code="Escape" type="button">Esc</button><button class="vk-key vk-key-ctrl" data-mod="ctrl" type="button">Ctrl</button><button class="vk-key vk-key-alt" data-mod="alt" type="button">Alt</button><button class="vk-key" data-key="Backspace" data-code="Backspace" type="button">⌫</button></div>
      <div class="vk-row"><button class="vk-key" data-key="s" data-code="KeyS" type="button">s</button><button class="vk-key" data-key="S" data-code="KeyS" data-shift="true" type="button">S</button><button class="vk-key" data-key=" " data-code="Space" type="button">Space</button><button class="vk-key" data-key="Enter" data-code="Enter" type="button">⏎</button></div>
    </nav>
    <script type="module" src="../../playground-cm5/main.ts"></script>
  </body>
</html>
