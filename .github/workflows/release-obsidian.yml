name: Release Obsidian Plugin

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Configure Git
        if: github.event_name == 'workflow_dispatch' && inputs.version != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version & sync Obsidian manifest
        if: github.event_name == 'workflow_dispatch' && inputs.version != 'none'
        run: |
          pnpm --filter obsidian-kakoune exec npm version ${{ inputs.version }} --no-git-tag-version
          node scripts/sync-obsidian-version.mjs
          VERSION=$(node -p "require('./packages/obsidian-kakoune/package.json').version")
          git add manifest.json versions.json packages/obsidian-kakoune/package.json packages/obsidian-kakoune/manifest.json packages/obsidian-kakoune/versions.json
          git commit -m "chore(obsidian): release $VERSION"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "$VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build Obsidian Plugin
        run: pnpm --filter obsidian-kakoune build

      - name: Determine tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(node -p "require('./packages/obsidian-kakoune/package.json').version")
            TAG="$VERSION"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Release tag: $TAG"

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packages/obsidian-kakoune/main.js
            packages/obsidian-kakoune/styles.css

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            packages/obsidian-kakoune/main.js
            packages/obsidian-kakoune/manifest.json
            packages/obsidian-kakoune/styles.css
          generate_release_notes: true
