name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  id-token: write # OIDC for npm trusted publishing and JSR
  contents: write # draft / releases via gh, pushing version tags and commits

jobs:
  publish:
    name: Release & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Configure Git
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version & sync JSR
        if: github.event_name == 'workflow_dispatch'
        run: |
          pnpm --filter codemirror-kakoune exec npm version ${{ inputs.version }} --no-git-tag-version
          node scripts/sync-jsr-version.mjs
          VERSION=$(node -p "require('./packages/codemirror-kakoune/package.json').version")
          git add package.json packages/codemirror-kakoune/package.json packages/codemirror-kakoune/jsr.json
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v$VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm run build

      - name: Publish to NPM
        run: pnpm --filter codemirror-kakoune publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to JSR
        run: npx jsr publish
        working-directory: packages/codemirror-kakoune

      - name: Extract version and tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=$(node -p "require('./packages/codemirror-kakoune/package.json').version")
            TAG="v$VERSION"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            TAG="$GITHUB_REF_NAME"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "Extracted version: $VERSION, tag: $TAG"

      - name: Create release with generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "Release v${VERSION}" \
            --generate-notes
